services:
  postgres:
    image: postgres:16
    container_name: safeplace-postgres
    environment:
      POSTGRES_DB: safeplace
      POSTGRES_USER: safeplace
      POSTGRES_PASSWORD: safeplace
    ports:
      - "5432:5432"
    volumes: 
      - "safeplace_pgdata:/var/lib/postgresql/data"

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safeplace
      DB_USER: safeplace
      DB_PASSWORD: safeplace
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  safeplace_pgdata:
