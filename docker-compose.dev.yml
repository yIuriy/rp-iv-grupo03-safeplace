services:
  postgres:
    image: postgres:16
    container_name: safeplace-postgres-dev
    environment:
      POSTGRES_DB: safeplace
      POSTGRES_USER: safeplace
      POSTGRES_PASSWORD: safeplace
    ports:
      - "5432:5432"
    volumes:
      - safeplace_pgdata_dev:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: safeplace
      DB_USER: safeplace
      DB_PASSWORD: safeplace
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
    ports:
      - "8080:8080"
      - "35729:35729"
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - maven_cache:/root/.m2
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8080/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  safeplace_pgdata_dev:
  maven_cache:
  frontend_node_modules:
